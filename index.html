<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>عالم المكعبات</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,Arial;color:white;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:start}.pill{background:#101827bb;border:1px solid #ffffff44;border-radius:12px;padding:8px 11px;font-weight:700;text-shadow:0 1px 2px #000}.btn{pointer-events:auto;border:0;border-radius:14px;padding:12px 14px;background:#6b45ff;color:white;font-size:15px;font-weight:800;box-shadow:0 4px 0 #3921a8}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3921a8}.controls{position:absolute;bottom:18px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px;pointer-events:auto}.ctl{border:1px solid #ffffff66;background:#172033b8;color:white;border-radius:14px;font-size:21px;font-weight:bold;touch-action:none}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{display:flex;gap:8px;align-items:end;pointer-events:auto}.actions .ctl{width:61px;height:61px;font-size:13px;background:#101827cc}.actions .jump{background:#6b45ff}.actions .break{background:#d84b42}.actions .place{background:#20a875}.bottominfo{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#101827aa;padding:6px 12px;border-radius:12px;white-space:nowrap;font-size:12px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;color:white;text-shadow:0 1px 3px black}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101827bb;z-index:5;padding:20px}.panel{max-width:400px;width:100%;background:#172033;border:1px solid #ffffff33;border-radius:22px;padding:22px;text-align:center;box-shadow:0 15px 60px #0007}.panel h1{margin:0 0 8px;font-size:27px}.panel p{line-height:1.7;color:#e2e8f0}.panel .btn{width:100%;font-size:18px;margin-top:8px}.small{font-size:12px!important;color:#cbd5e1!important}
@media(min-width:800px){.controls{bottom:25px}.cluster{transform:scale(1.1);transform-origin:bottom left}.actions .ctl{width:70px;height:70px}}
</style>
</head><body>
<div id="hud"><div class="top"><div class="pill">🧱 عالم المكعبات</div><div class="pill" id="count">المكعبات: 0</div><button class="btn" id="menuBtn">☰ القائمة</button></div><div class="bottominfo">حرّك الشخصية • اسحب الشاشة لتغيير الاتجاه</div><div class="cross">+</div><div class="controls"><div class="cluster"><button class="ctl up" data-move="forward">▲</button><button class="ctl left" data-move="left">◀</button><button class="ctl down" data-move="back">▼</button><button class="ctl right" data-move="right">▶</button></div><div class="actions"><button class="ctl break" id="breakBtn">كسر<br>🪓</button><button class="ctl place" id="placeBtn">بناء<br>🧱</button><button class="ctl jump" id="jumpBtn">قفز<br>⬆</button></div></div></div>
<div class="overlay" id="overlay"><div class="panel"><h1>🌍 عالم المكعبات</h1><p>لعبة ثلاثية الأبعاد مستوحاة من ألعاب المكعبات.<br>استكشف العالم، اقفز، واكسر وابنِ المكعبات!</p><button class="btn" id="startBtn">ابدأ اللعب</button><p class="small">نسخة تجريبية فردية — تحتاج اتصالًا بالإنترنت لتحميل محرك 3D أول مرة.</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,24,75);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,120);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.shadowMap.enabled=false;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x66804a,2));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(-10,20,8);scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x54b948}),dirt:new THREE.MeshLambertMaterial({color:0x8b5a35}),stone:new THREE.MeshLambertMaterial({color:0x858b91}),wood:new THREE.MeshLambertMaterial({color:0x79502c}),leaf:new THREE.MeshLambertMaterial({color:0x27853c}),sand:new THREE.MeshLambertMaterial({color:0xd9c17a}),brick:new THREE.MeshLambertMaterial({color:0xc45a43})};const geo=new THREE.BoxGeometry(1,1,1);let blocks=[];const blockMap=new Map();
function key(x,y,z){return `${x},${y},${z}`}function addBlock(x,y,z,type='grass',removable=true){const k=key(x,y,z);if(blockMap.has(k))return;const m=new THREE.Mesh(geo,mats[type]||mats.grass);m.position.set(x,y,z);m.userData={x,y,z,type,removable};scene.add(m);blocks.push(m);blockMap.set(k,m);return m}
// world platform and varied terrain
for(let x=-12;x<=12;x++)for(let z=-12;z<=12;z++){let type=(Math.abs(x)>8||Math.abs(z)>8)?'sand':'grass';addBlock(x,-1,z,type,false);if((x*7+z*13)%37===0&&Math.abs(x)>2&&Math.abs(z)>2){addBlock(x,0,z,'dirt',false);addBlock(x,1,z,'wood',false);addBlock(x,2,z,'wood',false);for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)addBlock(x+dx,3,z+dz,'leaf',false);addBlock(x,4,z,'leaf',false)}}
// distant hills
for(let i=0;i<35;i++){let x=Math.round(Math.sin(i*12.3)*17),z=Math.round(Math.cos(i*8.7)*17);if(Math.abs(x)<12&&Math.abs(z)<12)continue;for(let y=0;y<2+(i%3);y++)addBlock(x,y,z,y===0?'dirt':'grass',false)}
// avatar
const player=new THREE.Group();const skin=new THREE.MeshLambertMaterial({color:0xf1bc8d}),shirt=new THREE.MeshLambertMaterial({color:0x7c3aed}),pants=new THREE.MeshLambertMaterial({color:0x26334c}),hair=new THREE.MeshLambertMaterial({color:0x3b2416});function cube(parent,w,h,d,mat,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);parent.add(o);return o}cube(player,.62,.75,.34,shirt,0,.9,0);cube(player,.42,.42,.42,skin,0,1.52,0);cube(player,.44,.16,.44,hair,0,1.78,0);cube(player,.22,.12,.09,new THREE.MeshLambertMaterial({color:0x2775e8}),-.1,1.54,.22);cube(player,.22,.12,.09,new THREE.MeshLambertMaterial({color:0x2775e8}),.1,1.54,.22);cube(player,.23,.65,.28,pants,-.18,.2,0);cube(player,.23,.65,.28,pants,.18,.2,0);cube(player,.18,.62,.25,skin,-.42,.92,0);cube(player,.18,.62,.25,skin,.42,.92,0);scene.add(player);player.position.set(0,0,0);
let yaw=0,move={forward:false,back:false,left:false,right:false},vy=0,onGround=true,selected='brick',placed=0;const cameraOffset=new THREE.Vector3(0,3.2,6.5);let lastTouch=null,lookX=0;
function updateCamera(){const target=new THREE.Vector3(player.position.x,player.position.y+1.1,player.position.z);const off=cameraOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.copy(target).add(off);camera.lookAt(target)}
function tryBuild(remove){const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const x=Math.round(player.position.x+dir.x*2),z=Math.round(player.position.z+dir.z*2),y=0;if(remove){let best=null,dist=99;for(const b of blocks){if(!b.userData.removable)continue;let d=b.position.distanceTo(new THREE.Vector3(x,y,z));if(d<dist&&d<2.4){best=b;dist=d}}if(best){scene.remove(best);blockMap.delete(key(best.userData.x,best.userData.y,best.userData.z));blocks=blocks.filter(b=>b!==best);placed=Math.max(0,placed-1)}}else{let bx=Math.round(player.position.x+dir.x*2),bz=Math.round(player.position.z+dir.z*2);if(!blockMap.has(key(bx,0,bz))&&Math.hypot(bx-player.position.x,bz-player.position.z)>1){addBlock(bx,0,bz,selected,true);placed++}}document.getElementById('count').textContent='المكعبات: '+placed}
function jump(){if(onGround){vy=0.18;onGround=false}}
document.querySelectorAll('[data-move]').forEach(b=>{let k=b.dataset.move;const set=v=>{move[k]=v};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>set(false)))});document.getElementById('jumpBtn').onclick=jump;document.getElementById('breakBtn').onclick=()=>tryBuild(true);document.getElementById('placeBtn').onclick=()=>tryBuild(false);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientY>innerHeight*.25){lastTouch={x:e.clientX,y:e.clientY}}});renderer.domElement.addEventListener('pointermove',e=>{if(lastTouch){yaw-=(e.clientX-lastTouch.x)*.006;lastTouch={x:e.clientX,y:e.clientY}}});['pointerup','pointercancel'].forEach(ev=>renderer.domElement.addEventListener(ev,()=>lastTouch=null));
let running=false;function start(){document.getElementById('overlay').style.display='none';running=true;renderer.domElement.requestPointerLock?.()}document.getElementById('startBtn').onclick=start;document.getElementById('menuBtn').onclick=()=>{document.getElementById('overlay').style.display='flex';running=false};document.getElementById('overlay').addEventListener('pointerdown',e=>{if(e.target.id==='overlay'){} });
addEventListener('keydown',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')move.forward=true;if(e.code==='KeyS'||e.code==='ArrowDown')move.back=true;if(e.code==='KeyA'||e.code==='ArrowLeft')move.left=true;if(e.code==='KeyD'||e.code==='ArrowRight')move.right=true;if(e.code==='Space')jump();if(e.code==='KeyE')tryBuild(false);if(e.code==='KeyQ')tryBuild(true)});addEventListener('keyup',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')move.forward=false;if(e.code==='KeyS'||e.code==='ArrowDown')move.back=false;if(e.code==='KeyA'||e.code==='ArrowLeft')move.left=false;if(e.code==='KeyD'||e.code==='ArrowRight')move.right=false});
function animate(){requestAnimationFrame(animate);if(running){const f=(move.forward?1:0)-(move.back?1:0),s=(move.right?1:0)-(move.left?1:0);const speed=.095;player.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed;player.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;player.position.x=THREE.MathUtils.clamp(player.position.x,-11.5,11.5);player.position.z=THREE.MathUtils.clamp(player.position.z,-11.5,11.5);vy-=.009;player.position.y+=vy;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}player.rotation.y=yaw;updateCamera()}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
